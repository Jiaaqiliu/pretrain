# Presence of this file activates Kaggle mode in NemoReasonerBenchmark:
# the backend loads base + LoRA via vLLM and scores the dev CSV with the
# verbatim host metric (boxed-EM + relative-tolerance numeric fallback).
primary_metric_name: kaggle_nemo_boxed_em
default_split: kaggle_dev_local

# vLLM engine / sampling — match the Kaggle host contract verbatim.
# Hard facts from benchmark_reference.md § "Inference contract":
#   temperature=0.0, max_tokens=7680, max_model_len=8192, max_lora_rank=32.
# Drift here = local eval score diverges from public LB.
temperature: 0.0
top_p: 1.0
max_tokens: 7680
max_model_len: 8192
max_lora_rank: 32
# TP=8 splits the 30B model across all 8 H200s. Rollout throughput scales
# near-linearly with TP for decode-bound workloads (our 2560-token gens).
# Cycle-2 observed rollout at TP=1 took 23 min; TP=8 should land ~4-6 min.
tensor_parallel_size: 8
# With TP=8 each GPU holds a ~7.5 GiB model shard, leaving ~130 GiB per GPU
# for KV cache. 0.85 is still fine — plenty of room.
gpu_memory_utilization: 0.85
# 512 (up from 256) — TP=8 more than doubles effective KV cache, so we can
# keep more in-flight requests concurrently.
max_num_seqs: 512
seed: 0

# Path to the 30B base. If unset, the benchmark falls back to model/base.yaml::path.
model_path: /fsx/models/Nemotron-3-Nano-30B-A3B-BF16

# Optional cap on eval rows — useful for quick iteration. `null` means full split.
limit: null
