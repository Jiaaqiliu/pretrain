# Teacher-distillation config for the ``synth_generate`` pipeline stage.
# Output JSONL goes to ``data/synth/`` and is auto-appended to
# ``data/sources.yaml`` so subsequent SFT stages consume it.

# Provider options:
#   vllm_local  — load a local model on GPU via vLLM (e.g. the
#                 Nemotron-3-Super-120B-FP8 teacher). Heavy; runs in a
#                 subprocess so CUDA state is reclaimed before SFT.
#   bedrock     — call AWS Bedrock Converse against a managed model.
#                 No GPU; uses boto3 + ambient AWS creds on the driver host.
teacher_provider: bedrock

# For teacher_provider=bedrock this is a Bedrock model / inference-profile
# ID, not a local path. Claude Sonnet 4.6 is the default — strong
# reasoning trace quality, and meaningfully cheaper per trace than
# loading a local 120B model on 8 H200s.
teacher_model_path: us.anthropic.claude-sonnet-4-6

# AWS region for the bedrock client. us-west-2 has the US Sonnet 4.6
# inference profile enabled for this account.
bedrock_region: us-west-2

prompts_csv: /fsx/zzsamshi/nemotron-auto-research/data/splits/train_local.csv
out_name: teacher_traces.jsonl

# Domains to sample from the training CSV. bits + cipher have the
# largest headroom on the E-28 baseline (2.5% and 17.7% respectively).
domains: [cipher, bits]
per_domain: 250  # 500 total for the minimal first cycle
n_samples: 1

# Filter floor. Bedrock's outputTokens is Bedrock's own tokenizer (not
# the teacher's), so the min_tokens floor here counts Bedrock tokens —
# keep this conservative for the bedrock path.
min_tokens: 800
max_tokens: 8192

temperature: 0.8
top_p: 0.95
seed: 17

# vllm_local-only knobs (ignored when teacher_provider=bedrock). TP=8
# uses the whole box for 120B FP8; max_num_seqs=32 raises concurrency.
tp: 8
max_num_seqs: 32
gpu_memory_utilization: 0.9
