# Default data recipe — anchor, the known-good training set.
#
# Declarative spec consumed by agent_evolve/backends/nemo_reasoner/data/
# build_from_recipe.py (TBD). The anchor just points at the canonical
# materialized JSONL — new recipes are sibling YAMLs that describe mixes,
# filters, or teacher-generation steps. Data_worker writes them.

name: default_14718
description: >
  Canonical 14,718-row training set from huikang's public 0.85 LB
  Kaggle notebook: prompt/completion rows spanning 7 reasoning domains
  (bits, cipher, cryptarithm, equations, gravity, numerals, units).
  Starting mix for every recipe unless explicitly overridden.

# Materialized JSONL (canonical home — read-only, managed outside the fork).
# Other recipes can reference this path as a source.
out_path: /fsx/zzsamshi/nemotron-auto-research/data/nemo_reasoner/train/default_14718.jsonl
provenance: /fsx/zzsamshi/nemotron-auto-research/data/nemo_reasoner/train/default_14718.provenance.json

# No sources/filters/teacher_gen blocks here — this is a pre-built artifact.
# Example of a derived recipe that would live alongside this one:
#
#   name: cycle12_more_equations
#   inherits: default_14718
#   add:
#     - source: teacher_gen
#       domain: equations
#       n: 500
