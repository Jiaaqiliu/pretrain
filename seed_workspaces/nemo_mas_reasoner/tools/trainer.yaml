# Tools available to Trainer workers.
#
# NOTE: Training always runs through the platform StageRegistry —
# agent_evolve/model/runners/stages/*.py — via backend.run_trial. The
# Trainer role does NOT scaffold or edit workspace-local runner
# scripts; use the platform's @register_stage-based runners instead.

mem_write_kinds:
  - training_run         # requires refs to recipe_proposal AND dataset_snapshot
  - cv_result            # requires refs to >=1 training_run
  - submission_artifact  # packaged LoRA adapter zip; refs ≥1 training_run
  - breakthrough         # requires len(refs) >= 1
  - failed_attempt

tools:
  # ── Platform tools (schemas from _common_model) ──
  mem_write:
    description: >
      Append a typed record. `training_run` MUST include refs to a
      `recipe_proposal` AND a `dataset_snapshot`. `cv_result` MUST
      include refs to all `training_run`s involved.
  mem_search:  {}
  mem_recent:  {}
  mem_get:     {}
  mem_link:    {}
  skill_index: {}
  skill_load:  {}
  read_file:   {}
  list_dir:    {}

  # ── Backend tools ──
  launch_training:
    description: >
      Launch a training run on the configured backend. Executes through
      backend.run_trial → model/runners/stages/*.py (sft / rl /
      teacher_distill / solver_distill / data_merge / eval).
      Divergence handling is enforced by those stage runners.
    schema:
      properties:
        recipe_path: {type: string}
        data_path:   {type: string}
        ckpt_out:    {type: string}
        max_steps:   {type: integer}
        monitor:     {type: boolean, default: true}
      required: [recipe_path, data_path, ckpt_out]

  read_training_log:
    description: "Read live or final training log."
    schema:
      properties:
        job_id: {type: string}
      required: [job_id]

  read_checkpoint_metric:
    description: >
      Read metric.json beside a checkpoint. Returns final loss and
      any val metrics.
    schema:
      properties:
        ckpt_path: {type: string}
      required: [ckpt_path]

  rerun_recipe_with_seeds:
    description: >
      Run the same recipe N times with different seeds (and optionally
      M splits). Returns list of training_run job_ids.
    schema:
      properties:
        recipe_path: {type: string}
        data_path:   {type: string}
        seeds:       {type: array, items: {type: integer}}
        splits:      {type: array, items: {type: string}}
      required: [recipe_path, data_path, seeds]

  compute_stability:
    description: >
      Given a list of training_run ids, compute mean / stddev of the
      primary metric. Returns the stability table that goes into the
      cv_result body.
    schema:
      properties:
        training_run_ids: {type: array, items: {type: string}}
      required: [training_run_ids]

  pack_submission:
    description: >
      Package a LoRA adapter directory into a Kaggle-ready
      ``submission.zip``. Validates that ``adapter_config.json`` exists
      and LoRA rank <= 32, then writes a flat zip with the adapter files
      at the archive root. After calling this, trainer MUST write a
      ``submission_artifact`` record citing the training_run that
      produced ckpt_path and including ``zip_path`` + adapter config
      summary in the body — that record is what the reviewer cites when
      signing off cp_submission_ready.
    schema:
      properties:
        ckpt_path: {type: string}
        out_zip:
          type: string
          description: Path for the output zip — typically
                       ``submissions/<cycle>_<slug>.zip`` relative to
                       the workspace root.
      required: [ckpt_path, out_zip]
