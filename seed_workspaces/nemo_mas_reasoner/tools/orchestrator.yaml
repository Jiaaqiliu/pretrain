# Tools available to the Orchestrator (no execution, no memory writes).
#
# The Orchestrator does not write records — workers do. Platform tools
# (spawn_*, mem_search, mem_recent, mem_get, read_file, list_dir) are
# inherited by name from seed_workspaces/_common_model/tools/.

tools:
  # ── Spawning (orchestrator-only; schemas from _common_model) ──
  spawn_and_run_subagent: {}
  call_existing_agent:    {}

  # ── Read-only memory (no mem_write for the orchestrator) ──
  mem_search: {}
  mem_recent: {}
  mem_get:    {}

  # ── Read-only filesystem ──
  read_file:  {}
  list_dir:   {}

  # ── Quality Plan gate + human chat replies ──
  # checkpoint_sign: auto mode only (NEMO_MAS_CHECKPOINT_MODE=auto);
  # in manual mode the tool refuses and the human signs via the viewer.
  # directive_respond: always enabled — the orchestrator must ack every
  # human_directive it consumes, whether from the cycle brief or a
  # mid-cycle injection.
  checkpoint_sign:   {}
  directive_respond: {}
