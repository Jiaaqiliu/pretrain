# Tools available to Reviewer workers.
#
# Platform tools (mem_*, skill_*, read_file, list_dir) are inherited by
# name from seed_workspaces/_common_model/tools/. Only override their
# description/schema here if you want role-specific wording.
#
# `mem_write_kinds` below is authoritative for this role's whitelist
# (platform uses it to build the validator).

mem_write_kinds:
  - data_audit_finding
  - benchmark_rule
  - profile_run
  - eval_report
  - error_pattern
  - data_gap
  - breakthrough         # requires len(refs) >= 1
  - failed_attempt
  - checkpoint_review    # QA-officer duty: verdict on slot evidence
  - checkpoint_event     # allowed indirectly via checkpoint_sign (auto mode)

tools:
  # ── Platform tools (schemas from _common_model) ──
  mem_write:   {}
  mem_search:  {}
  mem_recent:  {}
  mem_get:     {}
  mem_link:    {}
  skill_index: {}
  skill_load:  {}
  read_file:   {}
  list_dir:    {}

  # ── QA-officer tools (reviewer handles Quality Plan verdicts) ──
  checkpoint_review_suggest:
    description: >
      Post a QA verdict on a Quality Plan checkpoint. Exists only for
      the reviewer role. Appends a ``checkpoint_review`` record with
      tags ``checkpoint:<slot_id>`` and ``verdict:<verdict>`` — the
      next fold lifts the slot's state based on this verdict. ``refs``
      MUST cite the evidence records being judged (≥1).
    schema:
      properties:
        slot_id:
          type: string
          description: Quality Plan slot id (e.g. cp_02_model_ready).
        verdict:
          type: string
          enum: [evidence_attached, ready_to_sign, insufficient, reject]
          description: >
            ``evidence_attached`` — some evidence present, not yet
            complete. ``ready_to_sign`` — evidence complete and healthy;
            in manual mode the slot goes to pending_human; in auto mode
            you may follow up with ``checkpoint_sign``. ``insufficient``
            — evidence present but inadequate (leave state as-is).
            ``reject`` — evidence looks wrong / training was unhealthy;
            reopens the slot.
        reason:
          type: string
          description: One-line summary of the verdict, ≤240 chars.
        refs:
          type: array
          items: {type: string}
          description: Evidence record ids this review cites (≥1).
        tags:
          type: array
          items: {type: string}
          description: Optional extra tags.
      required: [slot_id, verdict, reason, refs]

  checkpoint_sign:
    description: >
      Sign off a Quality Plan slot. Refused in manual mode (a human
      must click Sign in the viewer). In auto mode the reviewer may
      call this after writing a ``checkpoint_review`` with verdict
      ``ready_to_sign``; the handler re-checks evidence + deps and
      appends a ``checkpoint_event`` with ``event:signoff``.
    schema:
      properties:
        slot_id: {type: string}
        refs:
          type: array
          items: {type: string}
          description: Evidence record ids covering this slot's
                       requires_evidence kinds.
        note: {type: string}
      required: [slot_id, refs]

  # ── Backend tools (Reviewer-specific; schemas authoritative here) ──
  sample_jsonl:
    description: >
      Sample N rows from a JSONL file. Returns rows + per-field summary
      (type histogram + string-length p50/p95).
    schema:
      properties:
        path: {type: string}
        n:    {type: integer, default: 50}
        seed: {type: integer, default: 0}
      required: [path]

  count_by_field:
    description: >
      Group-by count over a JSONL file (e.g. count by `category`).
      Returns {value: count}.
    schema:
      properties:
        path:  {type: string}
        field: {type: string}
      required: [path, field]

  length_distribution:
    description: >
      Token-length histogram for a JSONL field. Returns p50/p95/p99 +
      mean + max.
    schema:
      properties:
        path:      {type: string}
        field:     {type: string}
        tokenizer: {type: string, default: "nemotron-3-nano"}
      required: [path, field]

  run_eval:
    description: >
      Run a full eval pass on a checkpoint against a split. Returns
      per-category accuracy, error-bucket counts, and the jsonl path
      of per-row outputs.
    schema:
      properties:
        ckpt_path: {type: string}
        split:     {type: string}
        limit:     {type: integer}
      required: [ckpt_path, split]

  run_short_training:
    description: >
      Launch a short training run for profiling only (default 200
      steps). Returns loss curve + status.
    schema:
      properties:
        recipe_diff: {type: string}
        max_steps:   {type: integer, default: 200}
        log_every:   {type: integer, default: 10}
      required: [recipe_diff]

  plot_loss_curve:
    description: >
      Generate a PNG (or markdown table in local mode) of loss vs step
      for one or more profile runs.
    schema:
      properties:
        training_run_ids: {type: array, items: {type: string}}
      required: [training_run_ids]

  compute_data_gap_table:
    description: >
      Cross-tabulate eval errors by (category, length_bucket) to surface
      where the model is weak. Used by the `compute_data_gap` skill.
    schema:
      properties:
        eval_report_id: {type: string}
      required: [eval_report_id]
