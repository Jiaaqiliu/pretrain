# Tools available to DataEngineer workers.

mem_write_kinds:
  - distill_batch
  - dataset_snapshot
  - breakthrough        # requires len(refs) >= 1
  - failed_attempt

tools:
  # Memory
  mem_write:
    description: >
      Append a typed record. Required: kind, title, body.
      `dataset_snapshot` body MUST include per-source counts and diff vs
      the previous snapshot. `distill_batch` body MUST include source,
      domain, count, cost, sample rows.
  mem_search:
    description: "BM25 search. Args: query, kind?, author?, tags?, cycle_range?, top_k=8."
  mem_recent:
    description: "Recent records. Args: kind?, author?, tags?, k=10."
  mem_get:
    description: "Full record by id."

  # Skills
  skill_index:
    description: "List skills under skills/<domain>/."
  skill_load:
    description: "Read full markdown for one skill."

  # Read-only access
  read_file:
    description: "Read a workspace file."
  list_dir:
    description: "List a workspace directory."

  # Distill / generation
  call_teacher_model:
    description: >
      Call a teacher model on a list of prompts. Args: model
      (e.g. 'claude-opus-4-6', 'nemotron-ultra-340b'), prompts (list),
      max_tokens (default 8000), temperature (default 0.7),
      system_prompt (optional). Returns list of completions + cost.
      Refuses if total expected token cost > 5x the worker's budget.
  load_checkpoint_for_inference:
    description: >
      Load a previously-trained checkpoint for self-distill. Args:
      ckpt_path. Returns an inference handle for batch_generate.
  batch_generate:
    description: >
      Generate completions from a loaded checkpoint. Args: handle,
      prompts (list), sampling_config (matches Kaggle eval contract
      by default: temperature=1.0, top_p=1.0, max_tokens=3584).
  filter_by_gold:
    description: >
      Rejection sampling: keep only generations whose extracted boxed
      answer matches the gold. Args: generations, golds. Returns
      kept rows + reject reasons.

  # Curation
  minhash_dedup:
    description: >
      Near-duplicate removal via MinHash LSH. Args: input_path (jsonl),
      key_field (e.g. 'prompt_rendered'), threshold (default 0.85).
      Returns dedup'd jsonl path.
  apply_format_filter:
    description: >
      Apply data/recipes/default.yaml filters to a JSONL. Returns
      filtered jsonl path + counts of dropped rows by reason.
  format_validate:
    description: >
      Schema check: ensure each row has required fields (prompt_rendered,
      completion, category, ...) and types. Returns ok/fail + first 10
      offending rows.
  mix_sources:
    description: >
      Build the final train.jsonl per data/mix.yaml weights. Args:
      sources (list of jsonl paths), weights (list of floats),
      curriculum_yaml (optional). Returns final path + per-source counts.

  # Output
  write_jsonl:
    description: >
      Write rows to a JSONL file under data/generated/ or data/final/.
      Args: path (relative to workspace), rows (list of dicts).
