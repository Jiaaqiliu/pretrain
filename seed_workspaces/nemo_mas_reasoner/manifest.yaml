name: nemo_mas_reasoner
contract_version: train-1.1
description: >
  Multi-agent system (planner, data_worker, trainer, reviewer) for the
  NVIDIA Nemotron Model Reasoning Kaggle challenge. The seed workspace is
  a forkable template: each evolution cycle forks it into
  runs/<exp>/cycles/NNNN/workspace/ and agents mutate only the evolvable
  layers below. Everything outside evolvable_layers is frozen per cycle.

defaults:
  benchmark: nemo_reasoner
  backend: nemo_reasoner   # agent_evolve/backends/nemo_reasoner/k8s/submit.sh

# The ONLY directories agents write to in a fork. Two evolvable dimensions:
#   - recipes/train — training hyperparameter YAMLs (planner writes siblings of default.yaml)
#   - recipes/data  — data-mix specs (data_worker writes siblings of default_data.yaml)
evolvable_layers:
  - recipes/train
  - recipes/data

# Read-only across cycles. Benchmark fixtures only — agent role
# contracts, skills, and tools live under .claude/ (Claude Code config,
# project-scoped) and are not part of the workspace.
protected_layers:
  - manifest.yaml
  - eval/local_splits.yaml     # benchmark fixtures
  - eval/kaggle_eval.yaml
  - eval/constraints.yaml

# Ephemeral per-fork state. TrainingWorkspace.fork() skips these when
# copying the seed, and runtime outputs land under artifacts/ by the
# backend's --out contract (train/eval never write outside a fork's
# artifacts/ tree).
artifact_layers:
  - memory                     # agent ledger (records.jsonl + BM25 index)
  - artifacts                  # model output: sft/, eval/, data/ subtrees

reload_strategy: hot
