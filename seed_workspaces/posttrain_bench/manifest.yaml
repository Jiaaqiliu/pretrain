name: posttrain_bench
contract_version: train-1.0

defaults:
  benchmark: posttrain_bench
  algorithm: mcgs
  backend: h200_single_node

evolvable_layers:
  - data/mix.yaml
  - data/curriculum.yaml
  - data/generators
  - data/filters
  - train/pipeline.yaml
  - train/optimizer.yaml
  - train/loss.yaml
  - train/batching.yaml
  - eval/error_taxonomy.yaml

protected_layers:
  - model/base.yaml
  - eval/local_splits.yaml
  - eval/safety_eval.yaml
  - data/raw

artifact_layers:
  - memory
  - checkpoints
  - evolution
