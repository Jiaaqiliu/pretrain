# Platform orchestrator tools — spawning + resuming workers.
# Only the Orchestrator role gets these; workers cannot spawn.

tools:
  spawn_and_run_subagent:
    description: >
      Spawn a fresh worker for one focused task. Role is one of
      reviewer / data_worker / planner / trainer. The worker gets a
      new Bedrock conversation, its role prompt + role tools, and runs
      until it returns `end_turn` or hits its turn limit. Returns the
      worker's final text summary plus the list of record ids it wrote.
    schema:
      properties:
        role:             {type: string}
        task:             {type: string}
        suggested_skills: {type: array, items: {type: string}}
        budget_tokens:    {type: integer}
      required: [role, task]

  call_existing_agent:
    description: >
      Resume a previously spawned worker with a new task message. Use
      when you want a worker to revisit its own prior analysis with
      fresh evidence (e.g. "given cv_result rec_X, was your hypothesis
      correct?"). The worker's full message history is preserved.
      Only works within the same cycle; cross-cycle continuity goes
      through memory records.
    schema:
      properties:
        agent_id: {type: string}
        task:     {type: string}
      required: [agent_id, task]

  checkpoint_sign:
    description: >
      Sign off a Quality Plan checkpoint. Only callable in auto mode
      (NEMO_MAS_CHECKPOINT_MODE=auto); in manual mode the tool refuses
      and a human must click the Sign button in the trace viewer.
      Intended use: the reviewer worker has already posted a
      checkpoint_review with verdict=ready_to_sign; the orchestrator
      (or the reviewer itself) then calls this to close the slot.
      Preconditions enforced server-side: every kind in the slot's
      requires_evidence must be covered by ≥1 record in refs, and all
      depends_on slots must already be signed or reopened. Emits one
      checkpoint_event with event:signoff and actor:<caller> tags.
    schema:
      properties:
        slot_id: {type: string}
        refs:    {type: array, items: {type: string}}
        note:    {type: string}
      required: [slot_id, refs]

  directive_respond:
    description: >
      Acknowledge a human_directive. Always call this after reading a
      directive in the cycle brief or mid-cycle injection, regardless
      of whether you spawn a subagent or defer. action is one of
      acknowledged | spawned_subagent | deferred | answered. summary
      is a one-paragraph reply that the viewer renders in the chat
      thread. If you spawned a worker, pass its role in spawned_role
      so the human can follow up. Writes a directive_response record
      with >=1 ref to directive_id.
    schema:
      properties:
        directive_id: {type: string}
        action:       {type: string}
        summary:      {type: string}
        spawned_role: {type: string}
      required: [directive_id, action, summary]
