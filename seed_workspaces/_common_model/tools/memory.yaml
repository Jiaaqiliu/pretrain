# Platform memory tools — shared across workspaces.
#
# Role YAMLs list these by name; descriptions + schemas are sourced here
# unless the role YAML overrides them explicitly.

tools:
  mem_write:
    description: >
      Append a typed record to the memory store. Required: kind, title,
      body. Optional: tags (list of strings), refs (list of record ids).
      The `author` field is set automatically from the calling role.
      Allowed kinds per role come from the role YAML's
      `mem_write_kinds:` list; writing a kind not in that list returns an
      error. Some kinds have ref requirements enforced by the platform
      (e.g. `breakthrough` needs >=1 ref, `recipe_proposal` needs a ref
      to an eval_report or data_gap, `training_run` needs refs to both a
      recipe_proposal and a dataset_snapshot).
    schema:
      properties:
        kind:  {type: string}
        title: {type: string}
        body:  {type: string}
        tags:  {type: array, items: {type: string}}
        refs:  {type: array, items: {type: string}}
      required: [kind, title, body]

  mem_search:
    description: >
      BM25 search over the typed-record memory. Returns a ranked list of
      {id, kind, author, cycle_id, title, score, snippet}.
    schema:
      properties:
        query:       {type: string}
        kind:        {type: string}
        author:      {type: string}
        tags:        {type: array, items: {type: string}}
        cycle_range: {type: array, items: {type: string}}
        top_k:       {type: integer, default: 8}
      required: [query]

  mem_recent:
    description: >
      Return the most recent N records, optionally filtered by kind,
      author, or tags. Returns [{id, kind, author, cycle_id, title,
      tags, refs, ts}].
    schema:
      properties:
        kind:   {type: string}
        author: {type: string}
        tags:   {type: array, items: {type: string}}
        k:      {type: integer, default: 10}
      required: []

  mem_get:
    description: "Fetch one full record by id."
    schema:
      properties:
        id: {type: string}
      required: [id]

  mem_link:
    description: >
      Add a refs edge from one record to another. Append-only — cannot
      be removed. Used to connect records across cycles after the fact.
    schema:
      properties:
        child_id:  {type: string}
        parent_id: {type: string}
        relation:  {type: string, default: refs}
      required: [child_id, parent_id]
