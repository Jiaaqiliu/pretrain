# Platform read-only filesystem tools.
# Sandboxed to the workspace root; memory/ and checkpoints/ are blocked.

tools:
  read_file:
    description: >
      Read a file under the workspace (utf-8). Sandboxed — paths that
      escape the workspace root are rejected. Reads under `memory/` and
      `checkpoints/` are blocked; use `mem_*` tools for memory access.
    schema:
      properties:
        path:      {type: string}
        max_bytes: {type: integer, default: 200000}
      required: [path]

  list_dir:
    description: "List entries under a workspace directory."
    schema:
      properties:
        path: {type: string, default: "."}
      required: []
