# 数据源配置
# 由 scripts/prepare_data_3b.py 生成，存放在 FSx 下
# 格式: numpy uint32 (olmo-core NumpyFSLDataset 格式)
# Tokenizer: dolma2 (vocab_size=100278)
sources:
  - path: /fsx/dev/jiaqi/data/olmo-3b-pretrain/web
    split: train
    format: numpy_uint32
    domain: web
  - path: /fsx/dev/jiaqi/data/olmo-3b-pretrain/code
    split: train
    format: numpy_uint32
    domain: code
  - path: /fsx/dev/jiaqi/data/olmo-3b-pretrain/math
    split: train
    format: numpy_uint32
    domain: math
  - path: /fsx/dev/jiaqi/data/olmo-3b-pretrain/books
    split: train
    format: numpy_uint32
    domain: books
  - path: /fsx/dev/jiaqi/data/olmo-3b-pretrain/academic
    split: train
    format: numpy_uint32
    domain: academic
