# OLMo2-3B 模型架构配置
# 使用 TransformerConfig.olmo2_3B() 工厂方法构建
# 实际参数: d_model=3328, n_layers=16, n_heads=16, block=reordered_norm, qk_norm=True
name: OLMo2-3B
path: null  # 从头预训练，不加载已有权重
factory: olmo2_3B
architecture:
  hidden_size: 3328
  num_layers: 16
  num_heads: 16
  vocab_size: 100352      # dolma2 padded: ceil(100278/128)*128
  max_seq_len: 4096
  rope_theta: 500000
  block_type: reordered_norm
  qk_norm: true
dtype: bfloat16
