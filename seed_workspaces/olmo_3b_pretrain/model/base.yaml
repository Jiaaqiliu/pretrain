# OLMo-3B 模型架构配置
# 对应 OLMo-core TransformerConfig 参数
name: OLMo-3B
path: null  # 从头预训练，不加载已有权重
architecture:
  hidden_size: 3072
  num_layers: 28
  num_heads: 24
  num_kv_heads: 24        # GQA: 24 KV heads (MHA)
  vocab_size: 100278      # OLMo-2 tokenizer
  max_seq_len: 4096
  intermediate_size: 8192  # SwiGLU FFN hidden
  rope_theta: 500000.0
  norm_type: rms_norm
  activation: swiglu
  tie_embeddings: false
dtype: bfloat16
