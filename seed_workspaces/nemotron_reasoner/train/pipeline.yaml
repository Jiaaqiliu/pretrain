# Real training pipeline. MCGS forks this workspace per cycle; mutators
# overwrite evolvable stage/optimizer knobs.
#
# Stages run top-to-bottom. ``synth_generate`` emits a JSONL + stats.json
# under ``data/synth/`` and appends it to ``data/sources.yaml`` so the next
# SFT stage sees the new prompts. SFT's ``max_steps`` caps optimizer steps
# at N (effective batch 32 ≈ ~3.5 min/step on 1× H200).
stages:
  # Data-generation stages (Phase 1/2). All disabled by default; a mutator or
  # a driver flips them on. Recipe at ``data/recipes/default.yaml`` controls
  # upsample ratios, filter strictness, and which categories run.
  - name: solver_distill
    type: solver_distill
    enabled: false
    recipe: data/recipes/default.yaml
    out_subdir: data/generated/solver_distill

  - name: teacher_distill
    type: synth_generate
    enabled: false  # flip to true (or patch via mutator) to run teacher-gen
    # verifier_gate: true   # uncomment once the benchmark registers verifiers
                            # to drop teacher rollouts that fail correctness

  - name: data_merge
    type: data_merge
    enabled: false
    recipe: data/recipes/default.yaml
    inputs:
      - data/generated/solver_distill
      # - data/synth   # add teacher_distill output subdir here if enabled
    out_subdir: data/generated/data_merge
    upsample_from_recipe: true
    register_in_sources: true
    source_format: jsonl_cot

  - name: sft_warmup
    type: sft
    epochs: 2
    max_steps: 8
    loss: cross_entropy
    data_mix: default
    enabled: true
  - name: rl_gspo
    type: rl
    # ── GSPO knobs (consumed by agent_evolve.model.runners.stages.rl).
    #    Mutators may overwrite any of these.
    loss: importance_sampling
    rollout: default
    enabled: false
    prompts_csv: /fsx/zzsamshi/nemotron-auto-research/data/splits/train_local.csv
    domains: [bits, cipher]
    per_domain: 25       # prompts per domain per iteration
    n_samples: 4         # G = rollouts per prompt (for group normalization)
    max_tokens: 2560     # vLLM generate cap during rollout
    seed: 11
    epochs: 1
    grad_accum: 8
    lr: 1.0e-5
    eps_low: 3.0e-4      # GSPO clip — paper defaults for Qwen3-30B
    eps_high: 4.0e-4
    advantage_mode: group     # group | loop | domain
    length_penalty_lambda: 0.0
    length_penalty_cap: 2500
    dapo_token_level: false   # true → switch to DAPO token-level ratio
    max_len: 2800        # drop rollouts whose prompt+completion exceeds this
    log_every: 4
