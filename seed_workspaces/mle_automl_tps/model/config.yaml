# ML Model Configuration for Tabular Playground Series May 2022
# Binary classification, 800K train / 100K test, 31 anonymous features.
# Evaluation metric: AUC-ROC.

model_type: xgboost

hyperparameters:
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0
  reg_alpha: 0
  reg_lambda: 1
  random_state: 42
  n_jobs: -1

# Feature engineering — using the generic BaseTabularFeatureEngineer
# (no domain-specific flags since features are anonymous).
feature_engineering:
  advanced: true
  fillna: median
  scale: false
  flags:
    drop_ids: true
    fill_numeric_median: true
    fill_categorical_mode: true
    fill_boolean_false: true
    log_transform_skewed: false      # searchable
    target_encoding: false           # searchable
    standard_scale: false            # searchable
    label_encode_categoricals: true

# Data paths
train_data: train.csv
test_data: test.csv
target_column: target
id_column: id

# Competition info
competition_id: tabular-playground-series-may-2022
task_type: classification
