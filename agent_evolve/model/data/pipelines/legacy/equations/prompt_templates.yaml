# Equations-domain prompt templates + Opus rubric.
#
# Substitutions (driver passes these in):
#   {prompt}         — the original Kaggle prompt (verbatim)
#   {rule_summary}   — hint.rule_summary (one line, e.g. "templates: '@'→a||b, '-'→a+b")
#   {per_component}  — newline-joined witness lines (stage tag + per-op rule
#                      lines + bijection if any)
#
# IMPORTANT: {kaggle_answer} MUST NOT appear in user-facing templates —
# leaking the gold answer turns the teacher into a back-rationalizer and
# makes reject_if_boxed_mismatch a no-op. The hint enters via the
# assistant prefill (continue_final_message), not the user message.
#
# Two template families:
#   teacher_v* / self_distill_v*           — user-message templates (no hint)
#   *_prefill                              — assistant-prefill templates
#                                            that weave the hint into the CoT
# Stage 2/3 config picks one of each via prompt_template_key + prefill_template_key.

templates:
  # v2 — tight: pins the LHS parse convention up front (so the model
  # doesn't trial-and-error operator position), asks for verification on
  # 2 examples + question application + boxed answer. Mirrors the bits
  # teacher_v2 in shape; bullet 1 is shorter because equations rules are
  # one-line per operator (not 8-bit-position lists).
  #
  # NO HINT in the user message: the per-operator rule arrives via the
  # assistant prefill (teacher_v2_prefill). The notation pin is a
  # property of the puzzle's syntax, not the answer.
  teacher_v2: |-
    {prompt}

    Notation convention (use exactly this — do not search for a different one):
      The LHS of each example has shape A·op·B where:
        A is a 2-character operand (LHS positions 0–1),
        op is a single-character operator (LHS position 2),
        B is a 2-character operand (LHS positions 3–4).
      Operands may be all-digit (the "digit" bucket) or include
      punctuation symbols that map to digits via a row-specific
      bijection (the "mixed" bucket). The output may include the
      operator symbol as a prefix or suffix when the underlying
      arithmetic result is negative.

    Write a concise explanation in three short sections:

      **1. State the rule and verify on 2 examples.**
         Identify the per-operator rule that fits every example, then
         pick the FIRST 2 input → output pairs and verify each by
         applying the rule and showing the intermediate computation.

      **2. Apply the rule to the question input.**
         Parse the question's LHS into A, op, B. Apply the per-operator
         rule. Show the intermediate arithmetic. If the result is
         negative and the row uses a prefix/suffix convention, apply it.

      **3. Final answer.**
         End with EXACTLY this single line, on its own:
            \boxed{<your answer>}

    Hard rules: do not restate the puzzle. Keep the whole response under 1000 words.

  # Assistant prefill paired with teacher_v2. The model resumes from the
  # last character (no trailing newline) under continue_final_message=true.
  # The prefill walks naturally into "verify on 2 examples", so the model
  # picks up by writing the verification rather than restating the rule.
  teacher_v2_prefill: |-
    Looking at the worked examples, the rule that fits every example and produces the question's expected output is:
    {rule_summary}

    Detailed witness:
    {per_component}

    **1. State the rule and verify on 2 examples.**

    Using the rule above, let me verify on the first two input → output pairs.

  # Self-distill: terse user message, no hint, no answer. The 30B is small,
  # so we keep instructions minimal. Hint flows in via the prefill below.
  self_distill_v1: |-
    {prompt}

    Solve step-by-step. End with \boxed{<your answer>}.

  # Assistant prefill paired with self_distill_v1. Same shape as the
  # teacher prefill but shorter — the 30B has a smaller budget for structure.
  self_distill_v1_prefill: |-
    Looking at the examples, the rule is:
    {rule_summary}

    {per_component}

    Applying this rule to the question:

# Opus process-supervision rubrics keyed by `rubric_key` in pipeline.yaml.
blocks:
  equations_cot_quality_v1: |-
    You are auditing a chain-of-thought (CoT) trace for a Wonderland
    equations puzzle. The puzzle prompt is reproduced below, followed
    by the model's CoT and its boxed answer. You also see the Kaggle
    stored answer that the trace was supposed to derive.

    Equations puzzles ask the model to infer a per-operator
    transformation rule from a few worked examples (e.g. "22@75 = 4521"
    might encode "concat(a+b, a*b)") and apply it to a new input. The
    rule may use:
      - direct arithmetic (a+b, a−b, a*b, a||b concat, …),
      - digit-level operations (digit-wise XOR, cross-multiply, …),
      - a symbol→digit bijection on punctuation operands,
      - reversed operands or reversed result,
      - operator-symbol prefix/suffix on negative results.

    Judge whether the trace is *internally consistent*: does the
    narrative actually derive the boxed answer from the rule it claims?

    Output STRICT JSON only, like this exact shape:
    {{
      "examples_check_correct": true|false,
      "rule_application_correct": true|false,
      "boxed_matches_derivation": true|false,
      "any_logical_leap": true|false,
      "overall_pass": true|false,
      "notes": "<one sentence>"
    }}

    ===== Puzzle prompt =====
    {examples_block}
    ===== Boxed answer in trace =====
    {boxed}
    ===== Kaggle expected answer =====
    {kaggle_answer}
    ===== CoT trace =====
    {cot}
    ===== END =====
