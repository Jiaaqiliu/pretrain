# 1-pod × 1-GPU Unsloth training — default recipe.
# Single node impact (one GPU). Parameterize via submit.sh.
#
# Placeholders: ${JOB_NAME} ${IMAGE} ${OUTPUT_DIR} ${RUN_NAME} ${LR}
#               ${NUM_STEPS} ${SAVE_EVERY} ${SEED} ${NODE_NAME}
#               ${WANDB_DISABLED} ${WANDB_API_KEY}

apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: default
  labels:
    app: a-evolve
    role: train
    recipe: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: a-evolve
        role: train
        recipe: default
    spec:
      restartPolicy: Never
      # Soft pin via nodeSelector instead of nodeName: scheduler-driven, so
      # if the chosen node is full the pod sits Pending until a slot frees,
      # rather than getting kubelet-rejected with UnexpectedAdmissionError.
      # NOTE: kubernetes.io/hostname on THIS cluster is the FQDN
      # (e.g. "ip-172-31-90-7.ap-southeast-3.compute.internal") — pass the
      # full DNS form to --node, not the short host. submit.sh strips this
      # stanza when --node is omitted.
      nodeSelector:
        kubernetes.io/hostname: ${NODE_NAME}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: trainer
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          workingDir: /fsx/zzsamshi/a-evolve
          command: ["python"]
          args:
            - "/fsx/zzsamshi/a-evolve/agent_evolve/backends/nemo_reasoner/k8s/entries/train_unsloth.py"
          env:
            - name: RECIPE_PATH
              value: "${RECIPE_PATH}"
            - name: OUTPUT_DIR
              value: "${OUTPUT_DIR}"
            - name: RUN_NAME
              value: "${RUN_NAME}"
            - name: LR
              value: "${LR}"
            - name: NUM_STEPS
              value: "${NUM_STEPS}"
            - name: SAVE_EVERY
              value: "${SAVE_EVERY}"
            - name: SEED
              value: "${SEED}"
            - name: WANDB_DISABLED
              value: "${WANDB_DISABLED}"
            - name: WANDB_PROJECT
              value: "nemo-mas-w"
            - name: WANDB_NAME
              value: "${RUN_NAME}"
            - name: WANDB_API_KEY
              value: "${WANDB_API_KEY}"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: PYTHONPATH
              value: "/fsx/zzsamshi/a-evolve"
            - name: HOME
              value: "/tmp"
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: fsx
              mountPath: /fsx
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
