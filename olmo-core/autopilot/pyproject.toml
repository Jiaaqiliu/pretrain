[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot"
version = "0.1.0"
description = "Autonomous LLM Training Agent - the world's first self-driving training system"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "AutoPilot Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "optuna>=3.5",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.25",
    "pydantic>=2.0",
    "click>=8.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
full = [
    "torch>=2.1",
    "wandb>=0.16",
    "olmo-core",
]

dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.10",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1",
    "mypy>=1.5",
]
slurm = ["submitit>=1.5"]
kubernetes = ["kubernetes>=28.0"]
all = ["autopilot[full,dev,slurm,kubernetes]"]

[project.scripts]
autopilot = "autopilot.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
