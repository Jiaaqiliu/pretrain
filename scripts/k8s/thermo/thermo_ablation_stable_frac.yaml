# PyTorchJob: WSD stable-phase ablation (Appendix E)
# 5 fractions × 1 seed = 5 sequential runs (same job, looped)
# 单节点 8 GPUs, 190M model
#
# kubectl apply -f thermo_ablation_stable_frac.yaml -n default \
#   --context arn:aws:eks:ap-south-1:801953956576:cluster/p5-llm
#
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: jiaqi-thermo-ablation-stable
  namespace: default
spec:
  runPolicy:
    backoffLimit: 0
    cleanPodPolicy: None
    ttlSecondsAfterFinished: 7200
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          labels:
            role: master
            job: jiaqi-thermo-ablation-stable
        spec:
          nodeSelector:
            eks.amazonaws.com/nodegroup: trainer5
          restartPolicy: Never
          containers:
          - name: pytorch
            image: 801953956576.dkr.ecr.ap-south-1.amazonaws.com/ads-foundation-model-training/verl-multiturn:1.0.2
            imagePullPolicy: Always
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -euxo pipefail
              echo "======== WSD Stable-Phase Ablation ========"

              pip install -e /fsx/dev/jiaqi/A-EVOLVE-V2/olmo-core/.[all] 2>&1 | tail -5
              pip install scipy matplotlib 2>&1 | tail -3

              BASE_DIR="/fsx/dev/jiaqi/thermo_experiments"

              for FRAC in 0.2 0.4 0.6 0.8 0.95; do
                echo ""
                echo "===== stable_frac=$FRAC ====="
                torchrun --nproc_per_node=$GPUS_PER_NODE \
                  /fsx/dev/jiaqi/A-EVOLVE-V2/scripts/thermo/train_wsd_ablation.py \
                  --stable-frac $FRAC \
                  --seed 42 \
                  --output-dir ${BASE_DIR}/ablation_stable_${FRAC}_s42
              done

              echo "All ablation runs complete."
            env:
            - name: WANDB_PROJECT
              value: "thermo-pretraining"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  key: WANDB_API_KEY
                  name: wandb-secret-jiaqi
            - name: NCCL_DEBUG
              value: "INFO"
            - name: FI_PROVIDER
              value: "efa"
            - name: FI_EFA_USE_DEVICE_RDMA
              value: "1"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_TIMEOUT
              value: "600"
            - name: CUDA_HOME
              value: "/opt/cuda-toolkit"
            - name: GPUS_PER_NODE
              value: "8"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            resources:
              limits:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 32
              requests:
                cpu: "96"
                memory: "512Gi"
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 32
            volumeMounts:
            - mountPath: /fsx
              name: fsx
            - mountPath: /dev/shm
              name: dshm
          volumes:
          - name: fsx
            persistentVolumeClaim:
              claimName: fsx
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: "1000Gi"
